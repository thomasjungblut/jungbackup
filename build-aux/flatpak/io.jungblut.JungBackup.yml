id: io.jungblut.JungBackup
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: jungbackup

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # A backup app has to read whatever the user chooses to back up and write to
  # any mounted drive or network share (NFS/SMB mounts under /mnt, /media, ...).
  - --filesystem=host
  # GVfs mounts (smb://, sftp:// opened in Files) appear here as FUSE paths.
  - --filesystem=xdg-run/gvfs
  # SFTP and Google Drive backups need the network. restic runs the runtime's ssh, which also needs
  # the user's SSH agent (keys and ~/.ssh/config are covered by --filesystem=host).
  - --share=network
  - --socket=ssh-auth
  # Import from Déjà Dup and switch off its schedule so both apps don't back up
  # twice. Flatpak hides ~/.var/app even with --filesystem=host.
  - --filesystem=~/.var/app/org.gnome.DejaDup/config/glib-2.0/settings

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    GOBIN: /app/bin
    GOEXPERIMENT: nodwarf5

cleanup:
  - /lib/pkgconfig
  - /share/man

modules:
  # Same restic version and vendored Go modules as Déjà Dup's Flathub build.
  - name: restic
    buildsystem: simple
    build-commands:
      - go install -mod=vendor -trimpath ./cmd/restic
    sources:
      - type: git
        url: https://github.com/restic/restic
        tag: v0.19.1
        commit: 6aa3a516ce654808a1f28f9fa21e9b7c8e6e90bf
      - restic.go.mod.yml

  # Google Drive: restic's rclone backend starts this. The upstream release
  # binary; building it from source would need its ~400 Go modules vendored.
  - name: rclone
    buildsystem: simple
    build-commands:
      - install -Dm755 rclone /app/bin/rclone
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.zip
        sha256: 349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702
      - type: archive
        only-arches: [aarch64]
        url: https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-arm64.zip
        sha256: 7e1e8d69654941b7b7df84ee74c5f7fb09cce7d5496947fb7bf16b55ff427d10

  - name: jungbackup
    buildsystem: meson
    sources:
      - type: dir
        path: ../..
